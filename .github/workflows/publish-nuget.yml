name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish
        required: true
        type: string
      commit:
        description: Full release commit SHA already merged into main
        required: true
        type: string
  pull_request:
    types: [closed]

permissions: {}

jobs:
  # Starts this workflow on the default branch when a release PR merges.
  dispatch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.title, 'release: ')
    name: dispatch release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run this workflow on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${PR_TITLE#release: }"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-nuget.yml/dispatches" \
            -f "ref=$DEFAULT_BRANCH" \
            -f "inputs[version]=$RELEASE_VERSION" \
            -f "inputs[commit]=$RELEASE_COMMIT"
          echo "Dispatched publish-nuget.yml on $DEFAULT_BRANCH for $RELEASE_VERSION at $RELEASE_COMMIT"

  # Validates the release and packs the NuGet packages.
  package:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
      sha256sums: ${{ steps.pack.outputs.sha256sums }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release version and commit
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${INPUT_VERSION#v}"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic release version" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full release commit SHA" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/$DEFAULT_BRANCH"
          git checkout --quiet --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(jq -er '.["."]' .release-please-manifest.json)" = "$RELEASE_VERSION"
          TAG="v${RELEASE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Build and pack
        id: pack
        run: |
          set -euo pipefail
          dotnet pack src/OursPrivacy/OursPrivacy.csproj --configuration Release --output "$RUNNER_TEMP/packages"
          cd "$RUNNER_TEMP/packages"
          shopt -s nullglob
          packages=(*.nupkg)
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "Expected at least one built package" >&2
            exit 1
          fi
          {
            echo 'sha256sums<<SHA256SUMS'
            sha256sum -- *
            echo 'SHA256SUMS'
          } >> "$GITHUB_OUTPUT"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
          retention-days: 7

  # Pushes the built packages, then tags and creates the GitHub Release.
  publish:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.package.outputs.version }}
      RELEASE_COMMIT: ${{ needs.package.outputs.commit }}

    steps:
      # Needed for tagging.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.package.outputs.commit }}

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - name: Verify package checksums
        working-directory: ${{ runner.temp }}/packages
        env:
          PACKAGE_SHA256SUMS: ${{ needs.package.outputs.sha256sums }}
        run: |
          set -euo pipefail
          sha256sum --check --strict <<<"$PACKAGE_SHA256SUMS"
          test "$(find . -type f -printf '%P\n' | LC_ALL=C sort)" = "$(cut -c67- <<<"$PACKAGE_SHA256SUMS" | LC_ALL=C sort)"

      # Trusted publishing: nuget.org exchanges this job's OIDC token for an API key
      # valid for one hour, under the policy for this repository and workflow file.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org user who created the policy, not the package owner.
          user: tylerzey

      - name: Publish package to nuget.org
        working-directory: ${{ runner.temp }}/packages
        run: |
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            [[ "$package" == *.symbols.nupkg ]] && continue
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag -a "$TAG" "$RELEASE_COMMIT" -m "Release $TAG"
            git -c credential.helper='!gh auth git-credential' push origin "refs/tags/$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --target "$RELEASE_COMMIT" --generate-notes --title "$TAG"
          fi
